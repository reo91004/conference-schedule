<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학회 타임라인</title>
<script src="vendor/js-yaml.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#ffffff; --fg:#191919; --muted:#787774; --faint:#b4b4b0; --line:#e3e2de;
  --card:#f7f7f5; --today:#e03e3e;
  --crypto:#2f6fde; --ai:#2b9a66; --etc:#d9730d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --fg:#e8e8e6; --muted:#9b9a97; --faint:#5a5a58; --line:#373737;
    --card:#252525; --today:#ff6b6b; --crypto:#5b93f0; --ai:#4cc38a; --etc:#f0913a;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --fg:#e8e8e6; --muted:#9b9a97; --faint:#5a5a58; --line:#373737;
  --card:#252525; --today:#ff6b6b; --crypto:#5b93f0; --ai:#4cc38a; --etc:#f0913a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
.wrap{padding:18px 16px 14px}
[hidden]{display:none!important}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.next{display:flex;gap:28px;flex-wrap:wrap}
.next .item{min-width:120px}
.next .dd{font-size:30px;font-weight:650;letter-spacing:-.035em;line-height:1}
.next .nm{font-size:13px;color:var(--muted);margin-top:6px;white-space:nowrap}
.next .nm b{color:var(--fg);font-weight:600}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--crypto);outline-offset:-2px}
.scroller{overflow-x:auto;overflow-y:hidden;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
svg{display:block}
.lbl-name{font-size:13px;fill:var(--muted)}
.lbl-name,.lbl-date{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.lbl-date{font-size:15px;font-weight:650;letter-spacing:-.01em}
.lbl-dd{font-size:11px;fill:var(--muted)}
.month{font-size:11px;fill:var(--faint)}
.ev{cursor:pointer}
.ev:focus{outline:none}
.ev:focus-visible circle.dot{stroke-width:4}
.tip{position:fixed;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.12);padding:10px 12px;font-size:12.5px;line-height:1.5;max-width:280px;opacity:0;transition:opacity .12s;z-index:5}
.tip.on{opacity:1}
.tip .t{font-weight:600;font-size:13.5px;margin-bottom:2px}
.tip .m{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tba b{color:var(--fg);font-weight:500}
.src{color:var(--faint);text-decoration:none;margin-left:8px}
.src:hover{color:var(--muted)}
.list{margin-top:8px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--card)}
.row .dd{font-size:20px;font-weight:650;letter-spacing:-.03em}
.row .nm{font-size:14px}
.row .nm b{font-weight:600}
.row .nm span{color:var(--muted)}
.row .when{font-size:13px;text-align:right;color:var(--fg)}
.row .when small{display:block;color:var(--muted);font-size:11.5px}
.row.past{opacity:.4}
.row .nm span{white-space:nowrap}
body{word-break:keep-all}
@media (max-width:560px){
  .next{gap:18px;flex-wrap:nowrap;overflow-x:auto;width:100%}
  .next .item{min-width:auto}
  .next .dd{font-size:24px}
  .next .nm{font-size:12px}
  .row{grid-template-columns:64px 1fr;row-gap:2px}
  .row .dd{font-size:18px;grid-row:span 2}
  .row .when{text-align:left;font-size:12.5px}
  .row .when small{display:inline;margin-left:6px}
}
.mhead{font-size:12px;color:var(--faint);padding:14px 2px 2px;letter-spacing:.02em}
.lane-name{font-size:13px;font-weight:600;fill:var(--fg)}
.lane-sub{font-size:11px;fill:var(--muted)}
.lane-lbl{font-size:11px;fill:var(--muted)}
.lane-date{font-size:12px;font-weight:600}
.lane-lbl,.lane-date{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.loading{font-size:13px;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="next" id="next"></div>
    <div class="ctrl">
      <div class="seg" role="group" aria-label="분야" id="fField">
        <button data-v="all" aria-pressed="true">전체</button>
        <button data-v="security" aria-pressed="false">Security</button>
        <button data-v="ai" aria-pressed="false">AI</button>
      </div>
      <div class="seg" role="group" aria-label="보기" id="fView">
        <button data-v="lanes" aria-pressed="true">학회별</button>
        <button data-v="list" aria-pressed="false">목록</button>
      </div>
      <div class="seg" role="group" aria-label="기간" id="fRange">
        <button data-v="3" aria-pressed="false">3개월</button>
        <button data-v="6" aria-pressed="true">6개월</button>
        <button data-v="12" aria-pressed="false">1년</button>
      </div>
    </div>
  </div>
  <div class="scroller" id="scroller"><svg id="tl" role="img" aria-label="학회 마감 타임라인"></svg></div>
  <div id="list" class="list" hidden></div>
  <div class="foot">
    <div class="legend">
      <span><i style="background:var(--crypto)"></i>Security</span>
      <span><i style="background:var(--ai)"></i>AI</span>
      <span><i style="background:var(--etc)"></i>기타</span>
      <span><i style="border:2px solid var(--muted);width:9px;height:9px"></i>Rebuttal · Notification</span>
      <span><i style="background:var(--muted);border-radius:2px;width:16px;height:4px"></i>개최</span>
    </div>
    <div class="tba"><span id="tba"></span> <a id="src" class="src" href="https://ccfddl.com" target="_blank" rel="noopener">ccfddl</a></div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
/* ── 데이터 ──────────────────────────────────────────────────────────────
   학회 일정은 ccfddl(github.com/ccfddl/ccf-deadlines)을 접속할 때마다 읽어 옵니다.
   읽기에 실패하면 이 저장소의 snapshot/ 사본을 씁니다.
   ccfddl에 없는 일정은 extras.json, 보여줄 학회 목록은 conferences.json에서 고칩니다.
   kind: deadline | review | result | event      field: security | ai | etc        */
let EVENTS = [], TBA = [];
const TZ = { AoE:-12, KST:9, UTC:0, GMT:0, PT:-8, PST:-8, PDT:-7, ET:-5, EST:-5, EDT:-4, CET:1, CEST:2 };
function tzOffset(tz){
  tz = String(tz||"AoE").trim();
  if(TZ[tz]!==undefined) return TZ[tz];
  const m = tz.match(/^(?:UTC|GMT)\s*([+-]\d+(?:\.\d+)?)?$/i);
  return m ? (m[1] ? parseFloat(m[1]) : 0) : -12;
}
// 'YYYY-MM-DD[ HH:MM[:SS]]' (현지 tz) → KST 'YYYY-MM-DDTHH:MM' 또는 날짜만
function toKST(t, tz){
  t = String(t).trim();
  if(!/^\d{4}-\d{2}-\d{2}/.test(t)) return null;
  if(t.length <= 10) return t.slice(0,10);
  const [d, hms] = t.split(/[ T]/), [y,mo,da] = d.split("-").map(Number), [h,mi] = hms.split(":").map(Number);
  const utc = Date.UTC(y,mo-1,da,h,mi) - tzOffset(tz)*3600e3;
  return new Date(utc + 9*3600e3).toISOString().slice(0,16);
}
const MON = {january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function pad(n){ return String(n).padStart(2,"0"); }
// "December 7-11, 2026" · "July 31 - August 6, 2027" · "September 6 - 9, 2027"
function parseRange(str){
  const m = String(str||"").match(/([A-Za-z]+)\.?\s+(\d{1,2})(?:\s*[-–]\s*(?:([A-Za-z]+)\.?\s+)?(\d{1,2}))?,?\s*(\d{4})/);
  if(!m) return null;
  const m1 = MON[m[1].toLowerCase()], m2 = m[3] ? MON[m[3].toLowerCase()] : m1, y = +m[5];
  if(!m1 || !m2) return null;
  const y2 = m2 < m1 ? y+1 : y;
  return { s:`${y}-${pad(m1)}-${pad(m[2])}`, e: m[4] ? `${y2}-${pad(m2)}-${pad(m[4])}` : null };
}
function rawText(t, tz){ return /\d/.test(t) ? `${String(t).slice(5,16).replace("-","/")} ${tz}` : ""; }

function normalize(doc, cfg){
  const conf = (Array.isArray(doc) ? doc[0] : doc) || {};
  const title = conf.title || cfg.path, out = [], f = cfg.field;
  const today = kstToday();
  (conf.confs||[]).forEach(c=>{
    const name = `${title} ${c.year}`, link = c.link, tz = c.timezone;
    let hasFuture = false, tbd = false;
    (c.timeline||[]).forEach(tl=>{
      const vol = (String(tl.comment||"").match(/(\d{4}\/\d)/)||[])[1];
      const cname = vol && cfg.label ? `${cfg.label} ${vol}` : name;
      const push = (key, label, kind) => {
        const v = tl[key]; if(v===undefined || v===null) return;
        if(/TBD|TBA/i.test(String(v))){ if(key==="deadline") tbd = true; return; }
        const d = kind==="deadline" ? toKST(v, tz) : (/^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0,10) : null);
        if(!d) return;
        if(kind==="deadline" && dayOf(d) >= today) hasFuture = true;
        out.push({ c:cname, g:name, s:label, f, k:kind, d, src:link, raw:kind==="deadline"?rawText(v,tz):"", place:c.place });
      };
      push("abstract_deadline","Abstract 마감","deadline");
      push("deadline","논문 마감","deadline");
      push("rebuttal_deadline","Rebuttal","review");
      push("decision_deadline","Notification","result");
    });
    const r = parseRange(c.date);
    if(r) out.push({ c:name, g:name, s:"개최", f, k:"event", d:r.s, e:r.e, src:link, place:c.place });
    c._future = hasFuture; c._tbd = tbd; c._end = r ? dayOf(r.e||r.s) : 0;
  });
  // 다음 투고 일정이 아직 없는 학회
  const list = conf.confs||[], last = list[list.length-1];
  if(last){
    if(last._tbd) TBA.push({ c:`${title} ${last.year}`, f });
    else if(!list.some(c=>c._future)){
      // 다음 회차 마감이 대략 9개월 안에 올 학회만 표시
      const dl = (last.timeline||[]).map(t=>toKST(t.deadline, last.timezone)).filter(Boolean).sort().pop();
      if(dl && dayOf(dl) + 365*DAY - today < 270*DAY) TBA.push({ c:`${title} ${last.year+1}`, f });
    }
  }
  return out;
}

async function getText(url){
  const r = await fetch(url, {cache:"no-cache"}); if(!r.ok) throw new Error(r.status); return r.text();
}
async function loadAll(){
  const cfg = JSON.parse(await getText("conferences.json"));
  let live = 0;
  const parts = await Promise.all(cfg.conferences.map(async c=>{
    let txt;
    try { txt = await getText(cfg.source + c.path); live++; }
    catch(_) { txt = await getText("snapshot/" + c.path.split("/").pop()); }
    return normalize(jsyaml.load(txt), c);
  }));
  EVENTS = parts.flat();
  try {
    const ex = JSON.parse(await getText("extras.json"));
    (ex.events||[]).forEach(x=>{
      const d = toKST(x.time, x.tz); if(!d) return;
      EVENTS.push({ c:x.conf, g:x.group||x.conf, s:x.label, f:x.field||"etc", k:x.kind||"deadline", d, e:x.end?toKST(x.end,x.tz):undefined,
        src:x.link, raw:x.note || rawText(x.time, x.tz) });
    });
  } catch(_){}
  EVENTS.sort((a,b)=>a.d<b.d?-1:1);
  const src = document.getElementById("src");
  src.textContent = live === cfg.conferences.length ? "ccfddl 기준" : "ccfddl 사본 기준";
}

/* ── 날짜 유틸 (모든 계산은 KST 달력 기준) ── */
const DAY = 864e5;
function kstToday(){ const n=new Date(Date.now()+9*3600e3); return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()); }
function dayOf(s){ const [y,m,d]=s.slice(0,10).split("-").map(Number); return Date.UTC(y,m-1,d); }
function fmt(s){ const t=new Date(dayOf(s)); return `${t.getUTCMonth()+1}/${t.getUTCDate()}`; }
function hm(s){ return s.length>10 ? " "+s.slice(11,16) : ""; }
function ddText(n){ return n===0?"D-Day": n>0?`D-${n}`:`D+${-n}`; }
const W = ["일","월","화","수","목","금","토"];

const state = { field:"all", months:6, view:"lanes" };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const color = f => css(f==="security"?"--crypto":f==="ai"?"--ai":"--etc");

function visible(){ return EVENTS.filter(e=>state.field==="all"||e.f===state.field); }

function renderNext(today){
  const up = visible().filter(e=>e.k==="deadline" && dayOf(e.d)>=today).slice(0,3);
  document.getElementById("next").innerHTML = up.length ? up.map(e=>{
    const n=(dayOf(e.d)-today)/DAY;
    return `<div class="item"><div class="dd" style="color:${color(e.f)}">${ddText(n)}</div>
      <div class="nm"><b>${e.c}</b> ${e.s} · ${fmt(e.d)}</div></div>`;
  }).join("") : `<div class="item"><div class="nm">남은 마감 없음</div></div>`;
  const tba = TBA.filter(t=>state.field==="all"||t.f===state.field);
  document.getElementById("tba").innerHTML = tba.length ? "일정 미발표 · " + tba.map(t=>`<b>${t.c}</b>`).join(", ") : "";
}

function axis(start,end,x,Y,H,top){
  let g="", d0=new Date(start), m=Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth()+1, 1);
  while(m < end){ const xm=x(m), dm=new Date(m);
    g += `<line x1="${xm}" y1="${top}" x2="${xm}" y2="${H-20}" stroke="${css("--line")}" stroke-width="1"/>`;
    g += `<text class="month" x="${xm}" y="${H-6}" text-anchor="middle">${dm.getUTCMonth()===0?dm.getUTCFullYear()+"년 ":""}${dm.getUTCMonth()+1}월</text>`;
    m = Date.UTC(dm.getUTCFullYear(), dm.getUTCMonth()+1, 1); }
  return g;
}
const SHORT = {"Abstract 마감":"Abstract","논문 마감":"논문","Rebuttal":"Rebuttal","Notification":"Notification","개최":"개최"};

function renderLanes(today){
  const svg=document.getElementById("tl"), scroller=document.getElementById("scroller");
  const start=today-10*DAY, end=today+state.months*30.4*DAY;
  const evs=visible().filter(e=>dayOf(e.e||e.d)>=start && dayOf(e.d)<=end);
  const rows=[...new Set(evs.map(e=>e.g))].map(g=>{
    const items=evs.filter(e=>e.g===g).sort((a,b)=>dayOf(a.d)-dayOf(b.d));
    const next=items.find(e=>dayOf(e.e||e.d)>=today)||items[items.length-1];
    return {g, items, key:dayOf(next.d), f:items[0].f, place:(items.find(i=>i.place)||{}).place};
  }).sort((a,b)=>a.key-b.key);
  const LW=150, RH=54, TOP=34, ppm={3:300,6:200,12:120}[state.months]||200;
  const W=Math.max(scroller.clientWidth, LW+state.months*ppm), H=TOP+rows.length*RH+28;
  const x=t=>LW+16+(t-start)/(end-start)*(W-LW-40);
  svg.setAttribute("width",W); svg.setAttribute("height",H); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  let g=axis(start,end,x,0,H,TOP-10);
  const xt=x(today);
  g+=`<line x1="${xt}" y1="${TOP-12}" x2="${xt}" y2="${H-20}" stroke="${css("--today")}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  g+=`<rect x="${xt-18}" y="${TOP-30}" width="36" height="18" rx="9" fill="${css("--today")}"/><text x="${xt}" y="${TOP-17}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#fff">오늘</text>`;
  rows.forEach((r,i)=>{
    const y=TOP+i*RH+RH/2, col=color(r.f);
    if(i%2===0) g+=`<rect x="0" y="${TOP+i*RH}" width="${W}" height="${RH}" fill="${css("--card")}" opacity=".55"/>`;
    g+=`<text class="lane-name" x="12" y="${y-2}">${r.g}</text>`;
    if(r.place) g+=`<text class="lane-sub" x="12" y="${y+14}">${(p=>p.length>=3?p.slice(-3,-1).join(", "):p.join(", "))(r.place.split(",").map(t=>t.trim().replace(/\s*\(.*\)$/,"")))}</text>`;
    const xs=r.items.map(e=>x(dayOf(e.d))), xe=r.items.map(e=>x(dayOf(e.e||e.d)));
    g+=`<line x1="${Math.min(...xs)}" y1="${y}" x2="${Math.max(...xe)}" y2="${y}" stroke="${col}" stroke-opacity=".35" stroke-width="2"/>`;
    const xsAll=r.items.map(e=>x(dayOf(e.d)));
    r.items.forEach((e,j)=>{
      const cx=xsAll[j], past=dayOf(e.e||e.d)<today, op=past?.38:1;
      const crowded=(j>0 && cx-xsAll[j-1]<62)||(j<xsAll.length-1 && xsAll[j+1]-cx<62);
      let mark="";
      if(e.e){ const x2=x(dayOf(e.e)); mark=`<rect x="${cx}" y="${y-5}" width="${Math.max(x2-cx,6)}" height="10" rx="5" fill="${col}"/>`; }
      else if(e.k==="deadline") mark=`<circle class="dot" cx="${cx}" cy="${y}" r="7" fill="${col}" stroke="${css("--bg")}" stroke-width="2"/>`;
      else mark=`<circle class="dot" cx="${cx}" cy="${y}" r="5.5" fill="${css("--bg")}" stroke="${col}" stroke-width="2.2"/>`;
      const above = !crowded || j%2===0;
      const lbl=`<text class="lane-date" x="${cx}" y="${above?y-11:y+22}" text-anchor="middle" fill="${col}">${fmt(e.d)}</text>`
        + (crowded ? "" : `<text class="lane-lbl" x="${cx}" y="${y+21}" text-anchor="middle">${SHORT[e.s]||e.s.replace(" 마감","")}</text>`);
      g+=`<g class="ev" tabindex="0" data-i="${EVENTS.indexOf(e)}" data-n="${EVENTS.indexOf(e)}" opacity="${op}" role="button" aria-label="${e.c} ${e.s} ${fmt(e.d)}">${mark}${lbl}</g>`;
    });
  });
  if(!rows.length) g+=`<text x="${W/2}" y="${TOP+30}" text-anchor="middle" class="lane-lbl">이 기간에는 일정이 없습니다</text>`;
  svg.innerHTML=g;
  scroller.scrollLeft=Math.max(0, xt-LW-scroller.clientWidth*0.15);
  bindTips(today);
}

function renderList(today){
  const el=document.getElementById("list"), end=today+state.months*30.4*DAY;
  const evs=visible().filter(e=>dayOf(e.e||e.d)>=today-3*DAY && dayOf(e.d)<=end);
  let html="", month="";
  evs.forEach(e=>{
    const t=new Date(dayOf(e.d)), mk=`${t.getUTCFullYear()}년 ${t.getUTCMonth()+1}월`;
    if(mk!==month){ month=mk; html+=`<div class="mhead">${mk}</div>`; }
    const n=(dayOf(e.d)-today)/DAY, past=dayOf(e.e||e.d)<today;
    const dd = e.k==="event" && n<=0 && !past ? "진행 중" : ddText(n);
    const ddcol = e.k==="deadline" ? color(e.f) : css("--muted");
    html+=`<div class="row${past?" past":""}" data-i="${EVENTS.indexOf(e)}" tabindex="0" role="link">
      <div class="dd" style="color:${ddcol}">${dd}</div>
      <div class="nm"><b>${e.c}</b> <span>${e.s}</span></div>
      <div class="when">${fmt(e.d)}(${W[t.getUTCDay()]})${hm(e.d)}${e.e?" – "+fmt(e.e):""}<small>${e.raw?"원문 "+e.raw:(e.place||"")}</small></div></div>`;
  });
  el.innerHTML = html || '<div class="mhead">이 기간에는 일정이 없습니다</div>';
  el.querySelectorAll(".row").forEach(r=>{
    const open=()=>{ const e=EVENTS[+r.dataset.i]; if(e.src) window.open(e.src,"_blank","noopener"); };
    r.addEventListener("click",open);
    r.addEventListener("keydown",k=>{ if(k.key==="Enter"){ open(); } });
  });
}

function render(){
  const today=kstToday();
  renderNext(today);
  const list=document.getElementById("list"), sc=document.getElementById("scroller");
  const isList=state.view==="list";
  list.hidden=!isList; sc.hidden=isList;
  document.querySelector(".legend").style.visibility = isList ? "hidden" : "visible";
  if(isList) renderList(today); else renderLanes(today);
}

function bindTips(today){
  const tip = document.getElementById("tip");
  const show = (el, evt) => {
    tip.innerHTML = el.dataset.n.split(",").map(k=>{ const e=EVENTS[+k], n=(dayOf(e.d)-today)/DAY;
      const wd = W[new Date(dayOf(e.d)).getUTCDay()];
      return `<div class="t">${e.c} · ${e.s}</div>${e.place?`<div class="m">${e.place}</div>`:""}
      <div>${fmt(e.d)}(${wd})${hm(e.d)}${e.e?" – "+fmt(e.e):""} <span class="m">KST · ${ddText(n)}</span></div>
      ${e.raw?`<div class="m">원문 ${e.raw}</div>`:""}`; }).join('<div style="height:8px"></div>')
      + `<div class="m" style="margin-top:6px">클릭하면 공식 페이지가 열립니다</div>`;
    const r = (evt && evt.clientX!=null) ? {x:evt.clientX,y:evt.clientY} : (()=>{const b=el.getBoundingClientRect();return {x:b.left+b.width/2,y:b.top}})();
    tip.style.left = Math.min(r.x+12, innerWidth-290)+"px";
    tip.style.top = Math.max(8, r.y-90)+"px";
    tip.classList.add("on");
  };
  document.querySelectorAll(".ev").forEach(el=>{
    el.addEventListener("mousemove", ev=>show(el,ev));
    el.addEventListener("focus", ()=>show(el));
    el.addEventListener("mouseleave", ()=>tip.classList.remove("on"));
    el.addEventListener("blur", ()=>tip.classList.remove("on"));
    const open = ()=>{ const e=EVENTS[+el.dataset.i]; if(e.src) window.open(e.src,"_blank","noopener"); };
    el.addEventListener("click", open);
    el.addEventListener("keydown", k=>{ if(k.key==="Enter"||k.key===" "){ k.preventDefault(); open(); } });
  });
}

function seg(id,key,cast){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute("aria-pressed", x===b));
    state[key]=cast(b.dataset.v);
    try{ localStorage.setItem("pacl-tl2", JSON.stringify(state)); }catch(_){}
    render();
  }));
}
try{ const s=JSON.parse(localStorage.getItem("pacl-tl2")||"null"); if(s){ Object.assign(state,s); if(state.view!=="list") state.view="lanes";
  document.querySelectorAll("#fField button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===state.field));
  document.querySelectorAll("#fRange button").forEach(b=>b.setAttribute("aria-pressed", +b.dataset.v===state.months));
  document.querySelectorAll("#fView button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===state.view)); } }catch(_){}
seg("fField","field",String); seg("fRange","months",Number); seg("fView","view",String);
document.getElementById("next").innerHTML='<div class="loading">일정 불러오는 중…</div>';
loadAll().then(render).catch(err=>{ document.getElementById("next").innerHTML='<div class="loading">일정을 불러오지 못했습니다.</div>'; console.error(err); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(EVENTS.length) render(); });
addEventListener("resize", ()=>{ clearTimeout(window._r); window._r=setTimeout(render,120); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>EVENTS.length&&render());
// 자정이 지나면 D-Day 갱신
setInterval(()=>loadAll().then(render).catch(()=>{}), 60*60e3);
</script>
